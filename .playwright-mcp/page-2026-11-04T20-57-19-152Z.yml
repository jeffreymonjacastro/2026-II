ún incertidumbre busca combinar automatización con revisión; el junior puede empeorar una decisión y un senior también puede fallar. Los beneficios observados dependen de las accuracies humanas **supuestas**, no son evidencia de rendimiento humano real. No hemos medido calibración completa, fatiga, dependencia humano–IA, tiempos ni equidad por subgrupos. El dataset es histórico y pequeño; una implementación real requiere validación externa y estudio humano antes de sostener beneficios operativos. SHAP hace la salida inspeccionable, pero no demuestra que la asistencia explicativa causó la mejora. \"\"\" display(Markdown(discussion)) (OUT / \"discusion_resultados.md\").write_text(discussion,encoding=\"utf-8\")"
