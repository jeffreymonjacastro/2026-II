  - generic [ref=f1e68]:
    - heading "Parte 1 — Comprensión del problema y exploración de datos (10%)" [level=2] [ref=f1e69]
    - heading "Actividad 1.1 — Comprensión del problema" [level=3] [ref=f1e70]
    - paragraph [ref=f1e71]: Aprobar a una persona que incumple puede causar pérdida de capital y gastos de recuperación. Rechazar a un buen cliente implica ingresos perdidos, daño a la relación comercial y posibles perjuicios injustos. Una clasificación automática también puede reproducir sesgos presentes en los datos.
    - paragraph [ref=f1e72]:
      - text: "El README fija costes diferentes:"
      - strong [ref=f1e73]: mal cliente aprobado = 5
      - text: "y"
      - strong [ref=f1e74]: buen cliente rechazado = 1
      - text: . Son costes relativos, no dinero real. Codificamos
      - code [ref=f1e75]: y=1
      - text: como
      - strong [ref=f1e76]: mal crédito
      - text: (código original 2), por lo que un falso negativo cuesta cinco y un falso positivo cuesta uno. El F1 principal es binario para mal crédito; también reportamos F1 macro. El PDF no especifica la variante de F1, por eso esta elección es explícita.
    - heading "Actividad 1.2 — Carga y comprobación del dataset" [level=3] [ref=f1e77]
    - paragraph [ref=f1e78]: Usamos las 20 columnas originales y su diccionario local. Las categorías A65 y A124 describen estados desconocidos en el origen; no son celdas nulas ni se borran. Las columnas personales sensibles se conservan para reproducir el ejercicio, sin interpretar el desempeño como evidencia suficiente de equidad o aptitud bancaria.
