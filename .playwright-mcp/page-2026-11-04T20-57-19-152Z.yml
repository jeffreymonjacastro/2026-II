      - generic [ref=f1e54]: "MODE = 'kaggle' SEED = 42 N_VAL_SIM, N_TEST_SIM = 200, 500 JUNIOR_ACCURACY, SENIOR_ACCURACY = 0.70, 0.95 GROUP = \"Equipo por completar\" if MODE == \"kaggle\": DATA = next(p.parent for p in Path(\"/kaggle/input\").rglob(\"german.data\")) OUT = Path(\"/kaggle/working\") else: here = Path.cwd().resolve() ROOT = next(p for p in [here, *here.parents] if (p / \"data/german.data\").exists()) DATA, OUT = ROOT / \"data\", ROOT / \"local/outputs\" OUT.mkdir(parents=True, exist_ok=True) versions = {p: metadata.version(p) for p in [\"numpy\", \"pandas\", \"scikit-learn\", \"scipy\", \"matplotlib\", \"shap\"]} summary = {\"status\": \"running\", \"stage\": \"setup\", \"mode\": MODE, \"seed\": SEED, \"python\": sys.version, \"platform\": platform.platform(), \"versions\": versions, \"human_simulation_only\": True} def checkpoint(stage, **values): summary.update(stage=stage, **values) (OUT / \"run_summary.json\").write_text(json.dumps(summary, indent=2, ensure_ascii=False), encoding=\"utf-8\") def savefig(name): plt.tight_layout() plt.savefig(OUT / name, dpi=150, bbox_inches=\"tight\") plt.show() plt.close() gpu = subprocess.run([\"nvidia-smi\", \"--query-gpu=name\", \"--format=csv,noheader\"], capture_output=True, text=True).stdout.strip() if MODE == \"kaggle\" else \"CPU local\" checkpoint(\"setup\", hardware=gpu, estimator_device=\"CPU (dataset pequeño)\") print(\"Entorno:\", MODE, \"| Hardware:\", gpu, \"| Salida:\", OUT)"
