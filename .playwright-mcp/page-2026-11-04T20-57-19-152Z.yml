  - generic [ref=f1e28]:
    - heading "Preparación del entorno" [level=3] [ref=f1e29]
    - paragraph [ref=f1e30]:
      - text: El notebook es autocontenido. Usa NumPy, pandas, scikit-learn, SciPy, Matplotlib, SHAP y joblib. Kaggle incluye además xgboost, lightgbm y catboost. Si falta SHAP, instalar
      - code [ref=f1e31]: pip install shap
      - text: en el entorno antes de ejecutar. No se requieren claves dentro del notebook. La sesión remota solicita Tesla T4; se registra el hardware, y se usa CPU para estos datos pequeños para mantener el mismo protocolo reproducible.
