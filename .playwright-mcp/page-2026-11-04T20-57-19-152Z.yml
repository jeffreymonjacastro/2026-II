    - generic [ref=f1e792]: "def simulate_analysts(truth, repetitions, seed): rng = np.random.default_rng(seed) u = rng.random((2,repetitions,len(truth))) return (np.where(u[0] < JUNIOR_ACCURACY, truth, 1-truth), np.where(u[1] < SENIOR_ACCURACY, truth, 1-truth)) def route(uncertainty,a,b): if not 0 <= a <= b: raise ValueError(\"Los umbrales requieren 0 <= A <= B\") return np.where(uncertainty<a,\"IA\",np.where(uncertainty<b,\"Junior\",\"Senior\")) def collaborate(ai,makers,junior,senior): return np.where(makers==\"IA\",ai,np.where(makers==\"Junior\",junior,senior)) def f1_many(truth,predictions): tp = np.sum((predictions==1)&(truth==1),axis=-1) fp = np.sum((predictions==1)&(truth==0),axis=-1) fn = np.sum((predictions==0)&(truth==1),axis=-1) return np.divide(2*tp,2*tp+fp+fn,out=np.zeros_like(tp,dtype=float),where=(2*tp+fp+fn)>0) # Controles con resultados conocidos y extremos de la política. assert np.isclose(f1_many(np.array([1,1,0,0]),np.array([[1,0,1,0]]))[0],0.5) assert np.all(route(np.array([0.1,0.6]),np.log(2)+1e-8,np.log(2)+1e-8)==\"IA\") assert np.all(route(np.array([0.1,0.6]),0,0)==\"Senior\") jcheck,scheck = simulate_analysts(np.tile([0,1],5000),10,10) assert abs(np.mean(jcheck==np.tile([0,1],5000))-0.70)<0.01 assert abs(np.mean(scheck==np.tile([0,1],5000))-0.95)<0.01 jval,sval = simulate_analysts(yv,N_VAL_SIM,seed=1001)"
