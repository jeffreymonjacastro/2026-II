      - generic [ref=f1e1597]: "for row in results.to_dict(\"records\"): d = all_decisions[all_decisions.Modelo==row[\"Modelo\"]] assert len(d)==200 and d.row_id.nunique()==200 assert row[\"N_IA\"]+row[\"N_Junior\"]+row[\"N_Senior\"]==200 f_ai = f1_score(d.y_true,d.y_ai) f_final = f1_score(d.y_true,d.y_final) assert np.isclose(row[\"F1 - Sólo IA\"],f_ai) assert np.isclose(row[\"F1 - IA + Human\"],f_final) assert np.isclose(row[\"Mejora\"],f_final-f_ai) assert np.isclose(row[\"HACS\"],0.6*f_final+0.2*row[\"Coverage\"]+0.2*row[\"Efficiency\"]) joblib.dump({\"preprocessor\":pre,\"model\":best_model,\"name\":best_name,\"policy\":chosen, \"features\":FEATURES,\"positive_class\":\"bad_credit\"},OUT / \"modelo_seleccionado.joblib\") manifest = [{\"name\":p.name,\"bytes\":p.stat().st_size,\"sha256\":hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(OUT.iterdir()) if p.is_file() and p.name not in {\"manifest.json\",\"run_summary.json\",\"__notebook__.ipynb\"}] (OUT / \"manifest.json\").write_text(json.dumps(manifest,indent=2),encoding=\"utf-8\") checkpoint(\"done\",status=\"complete\",selected_model=best_name,shap_additivity_max_error=additivity_error, selected_test={k:(v.item() if isinstance(v,np.generic) else v) for k,v in selected_result.to_dict().items()}, artifacts=[x[\"name\"] for x in manifest]) print(\"Estado:\",summary[\"status\"],\"| Etapa:\",summary[\"stage\"],\"| Modelo:\",best_name) print(\"Artefactos:\",len(manifest),\"| Directorio:\",OUT)"
