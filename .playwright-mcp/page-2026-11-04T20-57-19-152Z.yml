    - paragraph [ref=f1e12]:
      - text: Experimento reproducible de colaboración Humano–IA sobre Statlog German Credit. Las seis partes siguen
      - code [ref=f1e13]: Sem13_Hackaton11.pdf
      - text: . Los humanos son
      - strong [ref=f1e14]: simulados
      - text: ", no participantes reales. Las conclusiones se generan a partir de esta ejecución."
    - paragraph [ref=f1e15]:
      - strong [ref=f1e16]: "Protocolo:"
      - text: entrenamiento 60%, validación 20% y prueba 20%, estratificados. Elegimos el modelo por F1 de validación y congelamos la política antes de prueba. Se comparan todos los candidatos brevemente; el análisis detallado y la defensa corresponden exclusivamente al mejor modelo de validación.
    - paragraph [ref=f1e17]:
