dagógicos; no representan evidencia humana real. SHAP explica el clasificador, no mejora al simulador ni demuestra causalidad. No medimos fatiga, dependencia humano–IA, coste laboral ni equidad por grupos. Los umbrales de colaboración se buscan sobre sólo 200 casos de validación y pueden sobreajustar. Prueba ya se vio en v1; se necesita un conjunto externo y un experimento humano para sostener beneficios operativos. El cambio de F1 de malo a bueno altera la escala de comparación con v1. \"\"\" display(Markdown(discussion)) (OUT/\"discusion_resultados.md\").write_text(discussion,encoding=\"utf-8\")"
