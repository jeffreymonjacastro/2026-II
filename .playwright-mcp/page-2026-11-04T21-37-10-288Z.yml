    - heading "Parte 4 — Diseño del sistema Humano–IA (25%)" [level=2] [ref=e878]
    - heading "Actividad 4.1 — Umbrales y evidencia experimental" [level=3] [ref=e879]
    - paragraph [ref=e880]: "Los umbrales seleccionados se muestran junto a las candidatas: automatización frente a HACS. Se justifica la política con validación y variabilidad humana, sin revisarla después de mirar prueba. Los modelos finalistas también se eligen en validación. La prueba de v1 se reutiliza para comparación, no como test nuevo."
    - heading "Actividad 4.2 — Junior y senior simulados" [level=3] [ref=e881]
    - paragraph [ref=e882]:
      - text: Junior acierta con probabilidad 0.70 y senior 0.95. «Acierto» significa accuracy, no Precision. Cuando fallan, invierten la clase. Se reutilizan respuestas dentro de cada split para comparar políticas de forma pareada, sin reiniciar la semilla por cliente. El simulador usa etiquetas para generar respuestas sintéticas;
      - strong [ref=e883]: el enrutador nunca recibe esas etiquetas
      - text: . No modelamos fatiga ni errores correlacionados con dificultad; no hay evidencia de analistas humanos reales.
    - heading "Actividades 4.3 y 4.4 — Pipeline y comparación" [level=3] [ref=e884]
    - paragraph [ref=e885]: El pipeline produce probabilidad, entropía, responsable y decisión final. Cada caso tiene exactamente un responsable. La evaluación incluirá IA sola, junior para todos, senior para todos y colaboración. A=B implica cero juniors; es admisible porque el score no distingue coste laboral según experiencia.
