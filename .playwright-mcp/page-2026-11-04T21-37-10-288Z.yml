    - paragraph [ref=e1355]: En cada registro respondemos qué variables influyen, si el signo es coherente con la salida del modelo, para qué puede servir la explicación y qué confianza permite. «Coherente» significa consistencia interna, no una regla causal sobre una persona. Una explicación de una predicción errónea puede ser matemáticamente coherente y aun así exigir revisión. El simulador de humanos no utiliza SHAP; por tanto, no atribuimos a SHAP el incremento de F1.
