    - paragraph [ref=e101]:
      - text: Medimos F1 binario de
      - strong [ref=e102]: buen crédito
      - text: ", según la solicitud de esta v2. F1 de mal crédito y F1 macro quedan como métricas complementarias; ni el cambio de etiqueta ni un HACS mayor demuestran por sí solos menor riesgo financiero o mayor equidad."
    - heading "Actividad 1.2 — Datos y diccionario" [level=3] [ref=e103]
